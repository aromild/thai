<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thai Practice</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #e0e0e0;
    padding: 25px;
    border-radius: 20px;
    width: 380px;
    text-align: center;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    color: white;
    cursor: pointer;
}

.blue { background: #1976D2; }
.green { background: #4CAF50; }
.gray { background: #9E9E9E; }
.orange { background: #FF9800; }
.purple { background: #9C27B0; }

.hidden { display: none; }

#counter {
    color: gray;
    margin-bottom: 10px;
}

.pron-cn {
    font-size: 14px;
    color: #555;
}
</style>
</head>

<body>

<div class="card">

    <div id="counter"></div>

    <h3 id="cn"></h3>
    <h3 id="th" class="hidden"></h3>
    <div id="pron" class="hidden pron-cn"></div>

    <button class="blue" onclick="showThai()">显示泰文</button>
    <button class="blue" onclick="showPron()">显示发音</button>

    <button class="green" onclick="speakThai()">泰语发音</button>

    <button class="purple" onclick="autoPlayThai()">自动循环（泰语）</button>
    <button class="purple" onclick="autoPlayCNTH()">自动循环（中泰）</button>

    <button class="gray" onclick="next()">下一句</button>
    <button class="orange" onclick="random()">随机一句</button>

</div>

<script>

// ⭐⭐⭐ 数据区 ⭐⭐⭐
const data = [
{
cn:"你不寂寞么",
th:"ไม่เหงาเหรอ",
pron:"mâi ngǎo rŏe （麦-老-罗？）"
},
{
cn:"昨天晚上你梦到我了吗？",
th:"เมื่อวานคุณฝันถึงผมไหม",
pron:"Muea-wan kun fan-teung pom mai?"
},
{
cn:"这个甜么？",
th:"อันนี้หวานไหม",
pron:"an-ní wǎan mái"
},
{
cn:"比我还甜吗？",
th:"หวานกว่าฉันไหม",
pron:"wǎan gwàa chǎn mái"
},
{
cn:"不要辣",
th:"ไม่เผ็ดนะ / ไม่เผ็ดครับ",
pron:"mâi phèt ná / mâi phèt khráp"
}
];
// ⭐⭐⭐ 结束 ⭐⭐⭐

let index = 0;
let playing = false;

function update(){
    document.getElementById("cn").innerText = data[index].cn;
    document.getElementById("th").innerText = data[index].th;
    document.getElementById("pron").innerText = data[index].pron;

    document.getElementById("th").classList.add("hidden");
    document.getElementById("pron").classList.add("hidden");

    document.getElementById("counter").innerText = (index + 1) + " / " + data.length;
}

function showThai(){
    document.getElementById("th").classList.remove("hidden");
}

function showPron(){
    document.getElementById("pron").classList.remove("hidden");
}

function speak(text, lang="th-TH"){
    return new Promise(resolve=>{
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.rate = 0.9;
        utter.onend = resolve;
        speechSynthesis.speak(utter);
    });
}

function speakThai(){
    speak(data[index].th, "th-TH");
}

async function autoPlayThai(){
    playing = true;
    while(playing){
        await speak(data[index].th);
    }
}

async function autoPlayCNTH(){
    playing = true;
    while(playing){
        await speak(data[index].cn, "zh-CN");
        await speak(data[index].th);
    }
}

function next(){
    playing = false;
    index++;
    if(index >= data.length) index = 0;
    update();
}

function random(){
    playing = false;
    index = Math.floor(Math.random() * data.length);
    update();
}

update();

</script>

</body>
</html>
